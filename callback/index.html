<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09080d">
  <title>Conectando Spotify · Festivalfy</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09080d;color:#fff;font-family:system-ui,-apple-system,sans-serif}.card{max-width:360px;margin:20px;padding:25px;border:1px solid #312a37;border-radius:20px;background:#15121a;text-align:center}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#1ed760;box-shadow:0 0 0 7px rgba(30,215,96,.12);animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(.75);opacity:.65}}p{color:#aaa1b1;line-height:1.5}a{color:#d58aff}
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Conectando Spotify</h1>
    <p id="message">Estamos completando la conexión segura con Festivalfy.</p>
    <a id="backLink" href="../" hidden>Volver a Festivalfy</a>
  </div>
  <script>
    const CLIENT_ID = '0caa7697944d41fbb6416abac0bf45f8';
    const REDIRECT_URI = 'https://felix0-collab.github.io/festivalfy/callback';
    const message = document.getElementById('message');
    const backLink = document.getElementById('backLink');

    async function exchangeCode() {
      const params = new URLSearchParams(location.search);
      const error = params.get('error');
      const code = params.get('code');
      const returnedState = params.get('state');
      const expectedState = localStorage.getItem('festivalfy_spotify_state');
      const codeVerifier = localStorage.getItem('festivalfy_spotify_verifier');

      if (error) throw new Error('Spotify canceló la autorización: ' + error);
      if (!code || !codeVerifier) throw new Error('Faltan datos para completar la conexión.');
      if (!returnedState || returnedState !== expectedState) throw new Error('La validación de seguridad no coincide. Vuelve a intentarlo.');

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier
        })
      });
      const token = await response.json();
      if (!response.ok) throw new Error(token.error_description || token.error || 'Spotify no devolvió un token válido.');

      localStorage.setItem('festivalfy_spotify_access_token', token.access_token);
      if (token.refresh_token) localStorage.setItem('festivalfy_spotify_refresh_token', token.refresh_token);
      localStorage.setItem('festivalfy_spotify_expires_at', String(Date.now() + (token.expires_in - 60) * 1000));
      localStorage.removeItem('festivalfy_spotify_state');
      localStorage.removeItem('festivalfy_spotify_verifier');
      location.replace('../?spotify=connected');
    }

    exchangeCode().catch(error => {
      message.textContent = error.message;
      backLink.hidden = false;
    });
  </script>
</body>
</html>
